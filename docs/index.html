<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Apple Test Reports</title>
  <style>
    :root { color: #eef5ff; background: #0c1d3b; }
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      margin: 0;
      background: radial-gradient(circle at top right, #17487d, transparent 38rem), #0c1d3b;
      font: 16px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 38rem; padding: 2rem; text-align: center; }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4.8rem); letter-spacing: -0.06em; }
    p { color: #c2d2eb; font-size: 1.1rem; }
    code { border-radius: 0.5rem; padding: 0.15rem 0.4rem; background: rgba(255,255,255,0.1); color: white; }
  </style>
</head>
<body>
  <main>
    <h1>Fresh report history</h1>
    <p>The previous Appium reports were cleared. Run a report-aware test to create the first new report.</p>
    <p>For the full three-simulator suite, use <code>npm run test:parallel:split3</code>.</p>
  </main>
</body>
</html>
