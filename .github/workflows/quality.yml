name: Automation framework quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Audit selectors when the app source checkout is available
        run: |
          if [ -d ../connect-apple ]; then
            npm run selectors:audit
          else
            echo "Skipping source-backed selector audit: ../connect-apple is not checked out in CI."
          fi
